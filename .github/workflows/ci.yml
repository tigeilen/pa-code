name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, build & package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run package

      - name: Package VSIX
        run: npx --yes @vscode/vsce package -o pa-code.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: pa-code-vsix
          path: pa-code.vsix
          if-no-files-found: error
